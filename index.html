<title>KIT-AURORA ローバーラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#1d1d1d;--panel:#303030;--fg:#e6e6e6;--muted:#9d9d9d;--line:#1a1a1a;--accent:#0090c4;--accent-ink:#fff;--accent-text:#5ab7e0;--font:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:12px;display:flex;flex-direction:column}
nav{display:flex;align-items:center;gap:2px;padding:4px max(8px,env(safe-area-inset-left,0px)) 0;background:#252525;flex-wrap:wrap}
nav .brand{font-size:11px;font-weight:600;color:var(--muted);margin-right:10px}
nav button{font:inherit;font-size:12px;font-weight:500;padding:4px 16px;min-height:28px;border-radius:4px 4px 0 0;border:0;background:#303030;color:var(--muted);cursor:pointer}nav button:hover{color:var(--fg)}
nav button[aria-selected="true"]{background:#3d3d3d;color:#fff;box-shadow:inset 0 2px 0 var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
#app[hidden],#gate[hidden]{display:none}
#gate{flex:1;display:grid;place-items:center;padding:16px}
#gateForm{width:min(320px,100%);background:#303030;border-radius:4px;padding:0 0 12px;display:flex;flex-direction:column;gap:8px}
#gateForm .gh{background:#3d3d3d;border-radius:4px 4px 0 0;padding:6px 10px;font-weight:600}
#gateForm>:not(.gh){margin-inline:12px}
#gateForm label{color:#c9c9c9;margin-top:4px}
#gateForm input{font:inherit;height:28px;border:0;border-radius:4px;background:#545454;color:#fff;padding:0 8px;letter-spacing:.15em}
#gateForm input:focus-visible{outline:1px solid #7aa7d6}
#gateForm button{font:inherit;font-weight:600;height:28px;border:0;border-radius:4px;background:var(--accent);color:#fff;cursor:pointer}
#gateErr{margin:0;min-height:1.4em;color:#ff8f6b;font-size:11px}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
</style>
<div id="gate"><form id="gateForm" autocomplete="off"><div class="gh">KIT-AURORA ローバーラボ</div><label for="pw">パスワード</label><input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="パスワードを入力"><button type="submit">ひらく</button><p id="gateErr" role="alert"></p></form></div>

</nav>

</main>

const tabs={rover:document.getElementById('tab-rover'),tire:document.getElementById('tab-tire')};
const frames={rover:document.getElementById('f-rover'),tire:document.getElementById('f-tire')};
const loaded={};let pending=null;
function show(k){
  for(const n in tabs){const on=n===k;tabs[n].setAttribute('aria-selected',on);frames[n].hidden=!on;}
  if(!loaded[k]){loaded[k]=1;if(k==='rover')frames.rover.addEventListener('load',()=>{if(pending){frames.rover.contentWindow.postMessage(pending,'*');pending=null;}},{once:true});frames[k].srcdoc=SRC[k];}
  try{localStorage.setItem('aurora-tab',k)}catch(e){}
}
for(const n in tabs)tabs[n].addEventListener('click',()=>show(n));
tabs.rover.parentElement.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const k=tabs.rover.getAttribute('aria-selected')==='true'?'tire':'rover';show(k);tabs[k].focus();}});
function start(){let init='rover';try{const v=localStorage.getItem('aurora-tab');if(v&&tabs[v])init=v}catch(e){}
document.getElementById('gate').hidden=true;document.getElementById('app').hidden=false;show(init);}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.data));
  SRC=JSON.parse(new TextDecoder().decode(pt));
}
const form=document.getElementById('gateForm'),pwEl=document.getElementById('pw'),errEl=document.getElementById('gateErr');
async function tryPw(pw,quiet){
  if(!pw)return false;
  try{await unlock(pw);try{sessionStorage.setItem('aurora-pw',pw)}catch(e){}start();return true;}
  catch(e){if(!quiet){errEl.textContent=(window.crypto&&crypto.subtle)?'パスワードがちがいます。':'この環境では開けません(https のページで開いてください)。';pwEl.select();}return false;}
}
form.addEventListener('submit',async e=>{e.preventDefault();errEl.textContent='確認中…';await tryPw(pwEl.value.trim(),false);});
try{const saved=sessionStorage.getItem('aurora-pw');if(saved)tryPw(saved,true);}catch(e){}
pwEl.focus();
window.addEventListener('message',e=>{
  const d=e.data;if(!d||d.type!=='aurora-tire'||e.source!==frames.tire.contentWindow)return;
  const fresh=!loaded.rover;pending=fresh?d:null;show('rover');
  if(!fresh)frames.rover.contentWindow.postMessage(d,'*');
});
